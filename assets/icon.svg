      <stop offset="0" stop-color="#2F9BF0"/>
      <stop offset="1" stop-color="#0B4F9C"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD3FF"/>
      <stop offset="1" stop-color="#2F9BF0"/>
